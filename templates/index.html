<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContractLens - Contract & ToS Red-Flag Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 2.5h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-17a1 1 0 0 1 1-1Z" />
        <path d="M14 2.5v4h4" />
        <path d="M8.5 12h7M8.5 15h7M8.5 9h3.5" stroke="#b3402a" />
      </svg>
      <span class="brand-name">ContractLens</span>
    </div>
    <p class="subtitle">
      Paste in a contract or Terms &amp; Conditions document. It gets split into clauses,
      each one classified and checked against baseline norms, and anything unusual gets
      flagged and rewritten in plain English.
    </p>
  </header>

  <main class="container">
    <section class="input-section">
      <div class="input-tabs" role="tablist">
        <button type="button" class="tab-button active" data-tab="paste" role="tab">Paste text</button>
        <button type="button" class="tab-button" data-tab="upload" role="tab">Upload .txt file</button>
      </div>

      <div class="tab-panel" data-panel="paste">
        <textarea id="contract-text" rows="12" placeholder="Paste contract or Terms &amp; Conditions text here..."></textarea>
      </div>

      <div class="tab-panel hidden" data-panel="upload">
        <label class="file-drop" for="file-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4M12 4 8 8M12 4l4 4" />
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
          <span id="file-drop-label">Choose a .txt file, or drop it here</span>
        </label>
        <input type="file" id="file-input" accept=".txt" class="visually-hidden" />
      </div>

      <button type="button" id="analyze-button" class="primary-button">
        Analyze document
      </button>
      <p id="error-message" class="error-message hidden"></p>
    </section>

    <section id="results-section" class="results-section hidden">
      <div class="verdict-card">
        <div id="verdict-ring" class="verdict-ring" data-level="minimal">
          <span id="doc-score" class="verdict-score">-</span>
          <span class="verdict-score-max">/100</span>
        </div>
        <div class="verdict-detail">
          <span class="verdict-eyebrow">Overall red-flag score</span>
          <span id="doc-level" class="verdict-level">-</span>
          <span id="doc-flagged" class="verdict-sub">-</span>
        </div>
      </div>

      <div class="breakdown-header">
        <h2>Clause-by-clause breakdown</h2>
        <div class="breakdown-controls">
          <label class="checkbox-label">
            <input type="checkbox" id="flagged-only-checkbox" />
            Flagged only
          </label>
          <button type="button" id="download-csv-button" class="secondary-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V4M12 15l-3.5-3.5M12 15l3.5-3.5" />
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
            </svg>
            Download CSV
          </button>
        </div>
      </div>

      <div id="clause-list" class="clause-list"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
